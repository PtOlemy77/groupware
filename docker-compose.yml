services:
  postgres:
    image: postgres:16-alpine
    container_name: groupware-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: groupware_db
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d groupware_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
