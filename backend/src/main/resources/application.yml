server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: nexus-groupware-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/groupware_db}
    username: ${DB_USER:nexus}
    password: ${DB_PASSWORD:nexus_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-request-size: 2MB
app:
  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO
    org.hibernate.orm.jdbc.bind: OFF
