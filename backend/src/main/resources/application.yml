server:
  port: 8080

spring:
  application:
    name: nexus-groupware-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/groupware_db
    username: nexus
    password: nexus_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    property-naming-strategy: SNAKE_CASE
