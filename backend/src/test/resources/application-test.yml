spring:
  datasource:
    url: jdbc:h2:mem:groupware-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  procurement:
    enabled: false
    service-key: ''
  bootstrap:
    enabled: false
    email: ''
    password: ''
logging:
  level:
    root: WARN
    org.hibernate.SQL: WARN
    org.springframework: WARN
